<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Weather App</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>

    <div class="container">

        <h1>🌤 Weather App</h1>

        <p>Select a city to check the current weather</p>

        <div class="search-box">

            <select id="cityDropdown">

                <option value="">-- Select City --</option>

                <option value="Delhi">Delhi</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Kolkata">Kolkata</option>
        <option value="Chennai">Chennai</option>
        <option value="Bengaluru">Bengaluru</option>
        <option value="Hyderabad">Hyderabad</option>
        <option value="Pune">Pune</option>
        <option value="Jaipur">Jaipur</option>
        <option value="Lucknow">Lucknow</option>
        <option value="Ahmedabad">Ahmedabad</option>
        <option value="Bhopal">Bhopal</option>
        <option value="Patna">Patna</option>
        <option value="Chandigarh">Chandigarh</option>
        <option value="Srinagar">Srinagar</option>
        <option value="Shimla">Shimla</option>
        <option value="Goa">Goa</option>
        <option value="Kochi">Kochi</option>
        <option value="Visakhapatnam">Visakhapatnam</option>
        <option value="Nagpur">Nagpur</option>
        <option value="Indore">Indore</option>

            </select>

        </div>

        <div class="btn-group">

            <button id="weatherBtn" onclick="getWeather()">
                Get Weather
            </button>

            <button id="toggleBtn" onclick="toggleUnit()">
                °C / °F
            </button>

        </div>

        <br>

        <button id="locationBtn" onclick="getCurrentLocation()">
          📍 Use My Location
        </button>

        <button id="themeBtn" onclick="toggleTheme()">
            🌙 Dark Mode
        </button>

        <div id="loading" class="spinner"></div>

        <div id="weatherResult">

        </div>

        <div id="forecast">

        </div>

        <footer>
            <p>Made with ❤️ by Sonam </p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
